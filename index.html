<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIRCUIT//VAULT — Electronics Reference Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════
       TOKENS — DARK (default)
    ═══════════════════════════════════════════ */
    :root, [data-theme="dark"] {
      --bg:         #070b11;
      --surface:    #0d1520;
      --surface2:   #121d2c;
      --surface3:   #172232;
      --border:     #1e3048;
      --border2:    #253c5a;

      --blue:       #4f9cf9;
      --green:      #34d399;
      --amber:      #fbbf24;
      --red:        #f87171;
      --purple:     #c084fc;
      --cyan:       #22d3ee;
      --orange:     #fb923c;
      --teal:       #2dd4bf;

      --text:       #dce8f4;
      --text2:      #8db0cc;
      --muted:      #4e6d8a;

      --code-bg:    #060a10;
      --header-bg:  rgba(7,11,17,0.95);

      --glow-blue:  0 0 24px rgba(79,156,249,0.18);
      --glow-green: 0 0 20px rgba(52,211,153,0.14);
      --glow-amber: 0 0 16px rgba(251,191,36,0.2);

      --fav-idle:   #1e3048;
      --fav-active: #fbbf24;

      --cat-sensor-bg:  rgba(34,211,238,0.08);  --cat-sensor-fg:  #22d3ee; --cat-sensor-bd:  rgba(34,211,238,0.25);
      --cat-output-bg:  rgba(52,211,153,0.08);  --cat-output-fg:  #34d399; --cat-output-bd:  rgba(52,211,153,0.25);
      --cat-input-bg:   rgba(192,132,252,0.08); --cat-input-fg:   #c084fc; --cat-input-bd:   rgba(192,132,252,0.25);
      --cat-switch-bg:  rgba(251,191,36,0.08);  --cat-switch-fg:  #fbbf24; --cat-switch-bd:  rgba(251,191,36,0.25);
      --cat-power-bg:   rgba(248,113,113,0.08); --cat-power-fg:   #f87171; --cat-power-bd:   rgba(248,113,113,0.25);
      --cat-module-bg:  rgba(79,156,249,0.08);  --cat-module-fg:  #4f9cf9; --cat-module-bd:  rgba(79,156,249,0.25);
      --cat-storage-bg: rgba(251,146,60,0.08);  --cat-storage-fg: #fb923c; --cat-storage-bd: rgba(251,146,60,0.25);
    }

    /* ═══════════════════════════════════════════
       TOKENS — LIGHT
    ═══════════════════════════════════════════ */
    [data-theme="light"] {
      --bg:         #f0f4f9;
      --surface:    #ffffff;
      --surface2:   #f7f9fc;
      --surface3:   #edf1f7;
      --border:     #d0d9e8;
      --border2:    #9aabc0;

      --blue:       #2563eb;
      --green:      #059669;
      --amber:      #d97706;
      --red:        #dc2626;
      --purple:     #7c3aed;
      --cyan:       #0891b2;
      --orange:     #ea580c;
      --teal:       #0d9488;

      --text:       #0f172a;
      --text2:      #475569;
      --muted:      #64748b;

      --code-bg:    #f8fafc;
      --header-bg:  rgba(240,244,249,0.96);

      --glow-blue:  0 2px 16px rgba(37,99,235,0.1);
      --glow-green: none;
      --glow-amber: none;

      --fav-idle:   #d0d9e8;
      --fav-active: #d97706;

      --cat-sensor-bg:  rgba(8,145,178,0.07);  --cat-sensor-fg:  #0891b2; --cat-sensor-bd:  rgba(8,145,178,0.2);
      --cat-output-bg:  rgba(5,150,105,0.07);  --cat-output-fg:  #059669; --cat-output-bd:  rgba(5,150,105,0.2);
      --cat-input-bg:   rgba(124,58,237,0.07); --cat-input-fg:   #7c3aed; --cat-input-bd:   rgba(124,58,237,0.2);
      --cat-switch-bg:  rgba(217,119,6,0.07);  --cat-switch-fg:  #d97706; --cat-switch-bd:  rgba(217,119,6,0.2);
      --cat-power-bg:   rgba(220,38,38,0.07);  --cat-power-fg:   #dc2626; --cat-power-bd:   rgba(220,38,38,0.2);
      --cat-module-bg:  rgba(37,99,235,0.07);  --cat-module-fg:  #2563eb; --cat-module-bd:  rgba(37,99,235,0.2);
      --cat-storage-bg: rgba(234,88,12,0.07);  --cat-storage-fg: #ea580c; --cat-storage-bd: rgba(234,88,12,0.2);
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* ─── TOAST ─── */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      pointer-events: none;
    }
    .toast {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78rem;
      padding: 0.55rem 1rem;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      letter-spacing: 0.04em;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 900;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.2s, border-color 0.2s;
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: var(--blue);
      text-shadow: var(--glow-blue);
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      user-select: none;
    }
    .logo:hover { opacity: 0.75; }
    .logo .sl { color: var(--text2); }

    .search-wrapper {
      flex: 1;
      position: relative;
      max-width: 460px;
    }
    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      line-height: 0;
    }
    .search-icon svg { width: 14px; height: 14px; }
    #search {
      width: 100%;
      padding: 0.5rem 4.5rem 0.5rem 2.35rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.2s;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79,156,249,0.1);
      background: var(--surface);
    }
    .search-shortcut {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      pointer-events: none;
    }

    .header-controls {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-shrink: 0;
    }
    .stat-pills {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      margin-right: 0.25rem;
    }
    .stat-pill {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.66rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .stat-pill strong { color: var(--green); font-weight: 400; }

    .icon-btn {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.38rem 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--blue); color: var(--blue); }
    .icon-btn.active-amber {
      background: rgba(251,191,36,0.08);
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: var(--glow-amber);
    }
    .icon-btn.active-blue {
      background: rgba(79,156,249,0.08);
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: var(--glow-blue);
    }
    .badge {
      background: var(--amber);
      color: #000;
      border-radius: 3px;
      padding: 0 0.28rem;
      font-size: 0.58rem;
      font-weight: 700;
      min-width: 1.1em;
      text-align: center;
    }

    .theme-toggle { position: relative; width: 50px; height: 24px; flex-shrink: 0; cursor: pointer; }
    .theme-toggle input { display: none; }
    .theme-track {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
      transition: border-color 0.2s;
      overflow: hidden;
    }
    .theme-track:hover { border-color: var(--blue); }
    .theme-icon { font-size: 0.62rem; line-height: 1; z-index: 1; }
    .theme-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: var(--blue);
      border-radius: 50%;
      transition: transform 0.22s cubic-bezier(.4,0,.2,1), background 0.2s;
      z-index: 2;
    }
    [data-theme="light"] .theme-knob { transform: translateX(26px); background: var(--amber); }

    /* ─── FILTER BAR ─── */
    .filter-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-bar-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      gap: 0.25rem;
      align-items: center;
      height: 42px;
    }
    .filter-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.7rem;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn:hover { background: var(--surface2); color: var(--text2); border-color: var(--border); }
    .filter-btn.active { border-color: var(--blue); color: var(--blue); background: rgba(79,156,249,0.08); }
    .filter-btn[data-cat="all"].active { border-color: var(--green); color: var(--green); background: rgba(52,211,153,0.08); }
    .cat-count-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      background: var(--surface3);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.05rem 0.3rem;
      border-radius: 3px;
      min-width: 1.3em;
      text-align: center;
    }
    .filter-btn.active .cat-count-badge {
      background: rgba(79,156,249,0.1);
      border-color: rgba(79,156,249,0.28);
      color: var(--blue);
    }
    .filter-btn[data-cat="all"].active .cat-count-badge {
      background: rgba(52,211,153,0.1);
      border-color: rgba(52,211,153,0.28);
      color: var(--green);
    }

    /* ─── APP LAYOUT ─── */
    .app-layout {
      flex: 1;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.5rem 2rem;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      position: sticky;
      top: calc(58px + 42px + 1rem);
      height: calc(100vh - 58px - 42px - 2rem);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .results-info {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .results-info span { color: var(--green); }

    #cards-grid {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      overflow-y: auto;
      padding-right: 0.2rem;
      flex: 1;
    }
    #cards-grid::-webkit-scrollbar { width: 4px; }
    #cards-grid::-webkit-scrollbar-track { background: transparent; }
    #cards-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #cards-grid::-webkit-scrollbar-thumb:hover { background: var(--blue); }

    #no-results {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
      font-family: 'Share Tech Mono', monospace;
      color: var(--muted);
      font-size: 0.78rem;
    }
    #no-results .err-code {
      font-family: 'Orbitron', monospace;
      font-size: 2.25rem;
      color: var(--border2);
      display: block;
      margin-bottom: 0.5rem;
    }

    /* ─── CARD ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      position: relative;
      animation: fadeUp 0.22s ease both;
      flex-shrink: 0;
      overflow: hidden;
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 2px;
      background: var(--blue);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover { border-color: var(--border2); background: var(--surface2); }
    .card:hover::after { opacity: 0.6; }
    .card.active-card { border-color: var(--blue); background: var(--surface2); }
    .card.active-card::after { opacity: 1; }
    .card.keyboard-focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(79,156,249,0.15); }

    /* Compact mode */
    body.compact .card-body,
    body.compact .card-footer { display: none; }
    body.compact .card-header { padding: 0.5rem 2rem 0.5rem 0.8rem; }

    .card-header {
      padding: 0.65rem 2rem 0.45rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .card-id {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      color: var(--muted);
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 0.1rem 0.28rem;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .card-name {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--text);
      letter-spacing: 0.02em;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.1rem 0.38rem;
      border-radius: 2px;
      flex-shrink: 0;
      border: 1px solid;
    }
    .cat-sensor  { background: var(--cat-sensor-bg);  color: var(--cat-sensor-fg);  border-color: var(--cat-sensor-bd); }
    .cat-output  { background: var(--cat-output-bg);  color: var(--cat-output-fg);  border-color: var(--cat-output-bd); }
    .cat-input   { background: var(--cat-input-bg);   color: var(--cat-input-fg);   border-color: var(--cat-input-bd); }
    .cat-switch  { background: var(--cat-switch-bg);  color: var(--cat-switch-fg);  border-color: var(--cat-switch-bd); }
    .cat-power   { background: var(--cat-power-bg);   color: var(--cat-power-fg);   border-color: var(--cat-power-bd); }
    .cat-module  { background: var(--cat-module-bg);  color: var(--cat-module-fg);  border-color: var(--cat-module-bd); }
    .cat-storage { background: var(--cat-storage-bg); color: var(--cat-storage-fg); border-color: var(--cat-storage-bd); }

    .card-body { padding: 0 0.8rem 0.45rem; }
    .card-desc {
      font-size: 0.76rem;
      color: var(--text2);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc mark {
      background: rgba(251,191,36,0.22);
      color: var(--amber);
      border-radius: 2px;
      padding: 0 1px;
      font-style: normal;
    }
    .card-footer {
      padding: 0.4rem 0.8rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .card-voltage { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--amber); }
    .card-tags { display: flex; gap: 0.22rem; flex-wrap: nowrap; overflow: hidden; }
    .tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.56rem;
      color: var(--muted);
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 0.07rem 0.32rem;
      border-radius: 2px;
      white-space: nowrap;
    }
    .code-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.56rem;
      padding: 0.07rem 0.32rem;
      border-radius: 2px;
      border: 1px solid;
      white-space: nowrap;
    }
    .has-code { background: rgba(52,211,153,0.08); color: var(--green); border-color: rgba(52,211,153,0.25); }
    .no-code  { background: transparent; color: var(--muted); border-color: var(--border); }

    .fav-btn {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      color: var(--fav-idle);
      transition: color 0.15s, transform 0.15s;
      z-index: 2;
      padding: 2px;
    }
    .fav-btn:hover { transform: scale(1.25); color: var(--amber); }
    .fav-btn.active { color: var(--fav-active); }
    @keyframes favPop { 0%{transform:scale(1)} 40%{transform:scale(1.6)} 100%{transform:scale(1)} }
    .fav-btn.pop { animation: favPop 0.3s ease; }

    /* ─── MODULE PANEL ─── */
    .module-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: calc(100vh - 58px - 42px - 3rem);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 3rem 2rem;
      text-align: center;
      gap: 1.25rem;
    }
    .empty-icon { font-size: 3rem; opacity: 0.12; }
    .empty-title {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .empty-sub {
      font-size: 0.875rem;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.6;
    }
    .empty-recent {
      width: 100%;
      max-width: 400px;
      text-align: left;
    }
    .empty-recent-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .empty-recent-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .empty-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.32rem 0.65rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.73rem;
      color: var(--text2);
    }
    .empty-chip:hover { border-color: var(--blue); color: var(--blue); }

    /* ─── IMAGE GALLERY ─── */
    .image-gallery {
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
    }
    .image-gallery-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background: var(--surface3);
    }
    .image-gallery-img.error {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      opacity: 0.2;
    }

    .shortcuts-hint {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      opacity: 0.7;
    }
    .shortcuts-hint kbd {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.08rem 0.35rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      margin-right: 0.18rem;
    }

    /* Panel Header */
    .panel-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0.9rem 1.2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 0.7rem;
      flex-wrap: wrap;
      transition: background 0.2s;
    }
    .panel-title-area {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1;
      min-width: 0;
    }
    .panel-id {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 0.12rem 0.38rem;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .panel-title {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-actions { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }

    /* Tabs */
    .panel-tabs {
      display: flex;
      padding: 0 1.2rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .panel-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.6rem 0.9rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-btn:hover { color: var(--text2); }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

    .tab-pane { display: none; padding: 1.5rem; animation: fadeUp 0.2s ease; }
    .tab-pane.active { display: block; }

    /* Meta grid */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .meta-item { display: flex; flex-direction: column; gap: 0.22rem; }
    .meta-key {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .meta-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      color: var(--amber);
    }
    .meta-tags { display: flex; gap: 0.28rem; flex-wrap: wrap; margin-top: 0.1rem; }

    .panel-section-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .panel-desc { font-size: 0.9rem; line-height: 1.7; color: var(--text); }

    /* Pin table */
    .pin-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .pin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .pin-table th {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .pin-table td { padding: 0.62rem 0.9rem; border-bottom: 1px solid var(--border); }
    .pin-table tr:last-child td { border-bottom: none; }
    .pin-table tr:hover td { background: rgba(79,156,249,0.03); }
    .pin-name-cell { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--green); }
    .pin-type-badge {
      display: inline-flex;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      padding: 0.12rem 0.42rem;
      border-radius: 3px;
      border: 1px solid;
      text-transform: uppercase;
    }
    .pt-ground  { background: rgba(107,114,128,0.1); color: #9ca3af;       border-color: rgba(107,114,128,0.25); }
    .pt-power   { background: rgba(248,113,113,0.1); color: var(--red);    border-color: rgba(248,113,113,0.28); }
    .pt-analog  { background: var(--cat-input-bg);   color: var(--purple); border-color: var(--cat-input-bd); }
    .pt-digital { background: var(--cat-module-bg);  color: var(--blue);   border-color: var(--cat-module-bd); }
    .pt-i2c     { background: var(--cat-sensor-bg);  color: var(--cyan);   border-color: var(--cat-sensor-bd); }
    .pt-spi     { background: rgba(45,212,191,0.08); color: var(--teal);   border-color: rgba(45,212,191,0.25); }
    .pt-pwm     { background: rgba(251,146,60,0.08); color: var(--orange); border-color: rgba(251,146,60,0.25); }
    .pt-default { background: var(--surface3);       color: var(--muted);  border-color: var(--border); }
    .pin-desc-cell { color: var(--text2); font-size: 0.84rem; }

    /* Code */
    .code-container {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .code-lang {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.67rem;
      letter-spacing: 0.1em;
      color: var(--green);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .code-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }
    .copy-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.67rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.28rem 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .copy-btn:hover { color: var(--blue); border-color: var(--blue); }
    .copy-btn.copied { color: var(--green); border-color: var(--green); }

    pre {
      margin: 0;
      overflow-x: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #a8c8e8;
      counter-reset: line-number;
      padding: 0.5rem 0;
    }
    [data-theme="light"] pre { color: #1a2a4a; }
    pre::-webkit-scrollbar { height: 4px; }
    pre::-webkit-scrollbar-track { background: transparent; }
    pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .line {
      display: block;
      padding: 0 1rem 0 0;
    }
    .line::before {
      counter-increment: line-number;
      content: counter(line-number);
      display: inline-block;
      width: 2.8rem;
      text-align: right;
      color: var(--muted);
      border-right: 1px solid var(--border);
      padding-right: 0.7rem;
      margin-right: 0.85rem;
      font-size: 0.7rem;
      user-select: none;
      opacity: 0.45;
    }
    .line:hover { background: rgba(79,156,249,0.03); }
    .line:hover::before { opacity: 0.9; color: var(--blue); border-color: rgba(79,156,249,0.3); }

    .kw  { color: #79aaff; } .cm  { color: #5a8f5a; font-style: italic; }
    .str { color: #f0a070; } .num { color: #9ecb7a; }
    .fn  { color: #e8d885; } .pp  { color: #c586c0; }
    [data-theme="light"] .kw  { color: #0060cc; } [data-theme="light"] .cm  { color: #2d7a2d; }
    [data-theme="light"] .str { color: #a31515; } [data-theme="light"] .num { color: #008800; }
    [data-theme="light"] .fn  { color: #795e26; } [data-theme="light"] .pp  { color: #af00db; }

    .no-code-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2.5rem 2rem;
      text-align: center;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      line-height: 1.65;
    }
    .no-code-icon { font-size: 2rem; opacity: 0.15; display: block; margin-bottom: 0.7rem; }

    /* Info blocks */
    .info-block {
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      font-size: 0.875rem;
      line-height: 1.65;
      margin-bottom: 0.9rem;
    }
    .info-block:last-child { margin-bottom: 0; }
    .info-block.notes { background: rgba(34,211,238,0.05);  border: 1px solid rgba(34,211,238,0.15); }
    .info-block.tips  { background: rgba(52,211,153,0.05);  border: 1px solid rgba(52,211,153,0.15); }
    .info-block.warn  { background: rgba(248,113,113,0.06); border: 1px solid rgba(248,113,113,0.18); }

    .info-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.55rem;
    }
    .info-label.notes { color: var(--cyan); }
    .info-label.tips  { color: var(--green); }
    .info-label.warn  { color: var(--red); }

    .tips-list { list-style: none; padding: 0; }
    .tips-list li { display: flex; gap: 0.55rem; padding: 0.22rem 0; color: var(--text); font-size: 0.875rem; }
    .tips-list li::before { content: '▸'; color: var(--green); flex-shrink: 0; }
    .warn-list { list-style: none; padding: 0; }
    .warn-list li { display: flex; gap: 0.55rem; padding: 0.22rem 0; color: var(--text); font-size: 0.875rem; }
    .warn-list li::before { content: '⚠'; flex-shrink: 0; color: var(--red); }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.07em;
    }
    footer span { color: var(--green); }
    .footer-shortcuts {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.45rem;
    }
    .footer-shortcuts kbd {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.06rem 0.35rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      margin-right: 0.2rem;
    }

    /* Animations */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Global scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--blue); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 960px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar { position: relative; top: 0; height: auto; max-height: 48vh; }
      .module-panel { min-height: 60vh; }
    }
    @media (max-width: 640px) {
      .stat-pills { display: none; }
      .logo { font-size: 0.85rem; }
    }
    @media (max-width: 480px) {
      .header-inner { padding: 0 0.9rem; gap: 0.5rem; }
      .search-shortcut { display: none; }
      #compact-toggle { display: none; }
      .icon-btn .btn-label { display: none; }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="header-inner">
      <a class="logo" id="logo-home" href="#" role="button" aria-label="Reset to home">
        CIRCUIT<span class="sl">//</span>VAULT
      </a>

      <div class="search-wrapper">
        <span class="search-icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="6.5" cy="6.5" r="4.5"/>
            <path d="M10.5 10.5L14 14"/>
          </svg>
        </span>
        <input type="text" id="search" placeholder="Search modules, tags, pins…" autocomplete="off" spellcheck="false" />
        <kbd class="search-shortcut" id="search-shortcut">⌘K</kbd>
      </div>

      <div class="header-controls">
        <div class="stat-pills">
          <span class="stat-pill">TOTAL <strong id="total-count">0</strong></span>
          <span class="stat-pill">SHOWN <strong id="visible-count">0</strong></span>
        </div>

        <button class="icon-btn" id="compact-toggle" title="Toggle compact view">
          ⊞ <span class="btn-label">COMPACT</span>
        </button>

        <button class="icon-btn" id="fav-filter-btn" title="Show favourites only">
          ★ <span class="btn-label fav-label">FAVS</span>
          <span class="badge" id="fav-count-badge">0</span>
        </button>

        <label class="theme-toggle" title="Toggle light / dark mode">
          <input type="checkbox" id="theme-checkbox" />
          <div class="theme-track">
            <span class="theme-icon">🌙</span>
            <span class="theme-icon">☀️</span>
            <div class="theme-knob"></div>
          </div>
        </label>
      </div>
    </div>
  </header>

  <!-- ═══ FILTER BAR ═══ -->
  <nav class="filter-bar" id="filter-bar" aria-label="Category filters">
    <div class="filter-bar-inner">
      <button class="filter-btn active" data-cat="all">ALL <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="sensor">SENSOR <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="output">OUTPUT <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="input">INPUT <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="switch">SWITCH <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="power">POWER <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="module">MODULE <span class="cat-count-badge">0</span></button>
      <button class="filter-btn" data-cat="storage">STORAGE <span class="cat-count-badge">0</span></button>
    </div>
  </nav>

  <!-- ═══ MAIN LAYOUT ═══ -->
  <div class="app-layout">

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="results-info"><span id="results-label">0</span> MODULE(S)</div>
      </div>
      <div id="cards-grid">
        <div id="no-results">
          <span class="err-code">404</span>
          NO MODULES FOUND<br>TRY A DIFFERENT QUERY
        </div>
      </div>
    </aside>

    <main class="module-panel" id="module-panel" aria-live="polite">
      <!-- populated by JS -->
    </main>

  </div>

  <!-- ═══ FOOTER ═══ -->
  <footer>
    CIRCUIT//VAULT &mdash; <span id="footer-count">0 MODULES INDEXED</span>
    <div class="footer-shortcuts">
      <span><kbd>↑↓</kbd> Navigate</span>
      <span><kbd>Enter</kbd> Open</span>
      <span><kbd>Esc</kbd> Close / Clear</span>
      <span><kbd id="footer-kbd">⌘K</kbd> Search</span>
    </div>
  </footer>

  <script src="sensors-data.js"></script>
  <script src="component-examples.js"></script>
  <script>
  /* ═══════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════ */
  let currentFilter  = 'all';
  let currentSearch  = '';
  let showFavsOnly   = false;
  let activeModuleId = null;
  let compactMode    = false;
  let filteredData   = [];
  let focusedIdx     = -1;

  const FAV_KEY     = 'cv_favourites';
  const THEME_KEY   = 'cv_theme';
  const RECENT_KEY  = 'cv_recent';
  const COMPACT_KEY = 'cv_compact';

  let favourites     = new Set(JSON.parse(localStorage.getItem(FAV_KEY)   || '[]'));
  let recentlyViewed = JSON.parse(localStorage.getItem(RECENT_KEY)        || '[]');
  compactMode = localStorage.getItem(COMPACT_KEY) === '1';

  if (compactMode) document.body.classList.add('compact');

  function saveFavs()   { localStorage.setItem(FAV_KEY,   JSON.stringify([...favourites])); }
  function saveRecent() { localStorage.setItem(RECENT_KEY, JSON.stringify(recentlyViewed)); }

  const exampleMap = {};
  if (typeof componentExamples !== 'undefined') {
    componentExamples.forEach(e => { exampleMap[e.id] = e; });
  }

  /* ═══════════════════════════════════════════
     PLATFORM DETECTION
  ═══════════════════════════════════════════ */
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const kbdHint = isMac ? '⌘K' : 'Ctrl+K';
  document.getElementById('search-shortcut').textContent = kbdHint;
  document.getElementById('footer-kbd').textContent = kbdHint;

  /* ═══════════════════════════════════════════
     THEME
  ═══════════════════════════════════════════ */
  (function initTheme() {
    const t = localStorage.getItem(THEME_KEY) || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme-checkbox').checked = (t === 'light');
  })();

  document.getElementById('theme-checkbox').addEventListener('change', e => {
    const t = e.target.checked ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(THEME_KEY, t);
  });

  /* ═══════════════════════════════════════════
     TOAST
  ═══════════════════════════════════════════ */
  function showToast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, 2200);
  }

  /* ═══════════════════════════════════════════
     HELPERS
  ═══════════════════════════════════════════ */
  function getCatClass(cat) {
    return `cat-${(cat || '').toLowerCase().replace(/[^a-z]/g, '')}`;
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlightSearch(text, query) {
    const escaped = escapeHtml(text || '');
    if (!query || !query.trim()) return escaped;
    try {
      const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return escaped.replace(re, '<mark>$1</mark>');
    } catch (e) { return escaped; }
  }

  function highlightCode(code) {
    if (!code || code === 'N/A') return code;
    const patterns = [
      { name: 'cm',  regex: /\/\/[^\n]*|\/\*[\s\S]*?\*\// },
      { name: 'str', regex: /"(?:\\.|[^"\\])*"/ },
      { name: 'pp',  regex: /#\w+/ },
      { name: 'kw',  regex: /\b(?:void|int|float|bool|char|double|long|unsigned|const|return|if|else|for|while|do|break|continue|true|false|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|nullptr|NULL)\b/ },
      { name: 'num', regex: /\b\d+(?:\.\d+)?\b/ },
      { name: 'fn',  regex: /\b[a-zA-Z_][a-zA-Z0-9_]*(?=\s*\()/ }
    ];
    const masterRegex = new RegExp(patterns.map(p => `(${p.regex.source})`).join('|'), 'g');
    return code.replace(masterRegex, (...args) => {
      for (let i = 0; i < patterns.length; i++) {
        if (args[i + 1] !== undefined) return `<span class="${patterns[i].name}">${args[0]}</span>`;
      }
      return args[0];
    });
  }

  function wrapLines(highlightedHtml) {
    return highlightedHtml.split('\n').map(line => `<span class="line">${line}</span>`).join('\n');
  }

  function getPinTypeClass(connection) {
    const c = (connection || '').toLowerCase();
    if (c.includes('ground') || c.includes('gnd'))                                      return 'pt-ground';
    if (c.includes('power') || c.includes('vcc') || c.includes('vdd') || /[35]v/i.test(c)) return 'pt-power';
    if (c.includes('i2c') || c.includes('scl') || c.includes('sda'))                    return 'pt-i2c';
    if (c.includes('spi') || c.includes('miso') || c.includes('mosi') || c.includes('sck') || c.includes(' cs')) return 'pt-spi';
    if (c.includes('pwm'))                                                               return 'pt-pwm';
    if (c.includes('analog') || c.includes('adc'))                                      return 'pt-analog';
    if (c.includes('digital') || c.includes('gpio') || c.includes('input') || c.includes('output') || c.includes(' tx') || c.includes(' rx')) return 'pt-digital';
    return 'pt-default';
  }

  function updateFavBadge() {
    document.getElementById('fav-count-badge').textContent = favourites.size;
  }

  function updateCategoryCounts(data) {
    const counts = {};
    data.forEach(s => { counts[s.category] = (counts[s.category] || 0) + 1; });
    counts.all = data.length;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const badge = btn.querySelector('.cat-count-badge');
      if (badge) badge.textContent = counts[btn.dataset.cat] || 0;
    });
    const fc = document.getElementById('footer-count');
    if (fc) fc.textContent = `${data.length} MODULES INDEXED`;
  }

  function addToRecent(id) {
    recentlyViewed = [id, ...recentlyViewed.filter(i => i !== id)].slice(0, 5);
    saveRecent();
  }

  /* ═══════════════════════════════════════════
     RENDER SIDEBAR CARDS
  ═══════════════════════════════════════════ */
  function renderCards(data) {
    if (!data) return;
    const grid      = document.getElementById('cards-grid');
    const noResults = document.getElementById('no-results');
    if (noResults.parentNode) noResults.parentNode.removeChild(noResults);
    grid.innerHTML = '';

    const q = currentSearch.trim().toLowerCase();

    filteredData = data.filter(s => {
      if (showFavsOnly && !favourites.has(s.id)) return false;
      if (currentFilter !== 'all' && s.category !== currentFilter) return false;
      if (!q) return true;
      return (
        s.name.toLowerCase().includes(q) ||
        (s.description || '').toLowerCase().includes(q) ||
        (s.tags || []).some(t => t.toLowerCase().includes(q)) ||
        (s.category || '').toLowerCase().includes(q)
      );
    });

    document.getElementById('results-label').textContent = filteredData.length;
    document.getElementById('visible-count').textContent  = filteredData.length;
    document.getElementById('total-count').textContent    = data.length;

    focusedIdx = -1;

    if (filteredData.length === 0) {
      noResults.style.display = 'block';
      grid.appendChild(noResults);
      return;
    }

    noResults.style.display = 'none';
    grid.appendChild(noResults);

    filteredData.forEach((s, idx) => {
      const ex      = exampleMap[s.id];
      const hasCode = ex && ex.hasCode;
      const isFav   = favourites.has(s.id);
      const isActive = activeModuleId === s.id;

      const card = document.createElement('div');
      card.className = `card${isActive ? ' active-card' : ''}`;
      card.style.animationDelay = `${Math.min(idx * 0.025, 0.28)}s`;
      card.dataset.id = String(s.id);

      const descHtml = highlightSearch(s.description || '', q);
      const tagsHtml = (s.tags || []).slice(0, 2).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

      card.innerHTML = `
        <button class="fav-btn${isFav ? ' active' : ''}" data-id="${s.id}" title="${isFav ? 'Remove favourite' : 'Add to favourites'}" aria-label="Toggle favourite">★</button>
        <div class="card-header">
          <span class="card-id">#${String(s.id).padStart(2, '0')}</span>
          <span class="card-name">${escapeHtml(s.name)}</span>
          <span class="cat-badge ${getCatClass(s.category)}">${s.category}</span>
        </div>
        <div class="card-body">
          <p class="card-desc">${descHtml}</p>
        </div>
        <div class="card-footer">
          <span class="card-voltage">${escapeHtml(s.voltage || '—')}</span>
          <div class="card-tags">
            <span class="code-badge ${hasCode ? 'has-code' : 'no-code'}">${hasCode ? 'CODE ✓' : 'N/A'}</span>
            ${tagsHtml}
          </div>
        </div>
      `;

      card.addEventListener('click', e => {
        if (e.target.closest('.fav-btn')) return;
        focusedIdx = idx;
        loadModule(s);
      });

      card.querySelector('.fav-btn').addEventListener('click', e => {
        e.stopPropagation();
        toggleFav(s.id, e.currentTarget);
      });

      grid.insertBefore(card, noResults);
    });
  }

  /* ═══════════════════════════════════════════
     FAVOURITES
  ═══════════════════════════════════════════ */
  function toggleFav(id, starEl) {
    if (favourites.has(id)) {
      favourites.delete(id);
      if (starEl) { starEl.classList.remove('active'); starEl.title = 'Add to favourites'; }
    } else {
      favourites.add(id);
      if (starEl) {
        starEl.classList.add('active');
        starEl.title = 'Remove favourite';
        starEl.classList.add('pop');
        setTimeout(() => starEl.classList.remove('pop'), 350);
      }
    }
    saveFavs();
    updateFavBadge();
    if (activeModuleId === id) syncPanelFavBtn();
    if (showFavsOnly) renderCards(typeof sensorsData !== 'undefined' ? sensorsData : []);
  }

  function syncPanelFavBtn() {
    const isFav = favourites.has(activeModuleId);
    const btn   = document.getElementById('panel-fav-btn');
    if (!btn) return;
    btn.classList.toggle('active-amber', isFav);
    const lbl = document.getElementById('panel-fav-label');
    if (lbl) lbl.textContent = isFav ? 'SAVED ✓' : 'FAVOURITE';
  }

  /* ═══════════════════════════════════════════
     MODULE DETAIL PANEL
  ═══════════════════════════════════════════ */
  function loadModule(s) {
    activeModuleId = s.id;
    addToRecent(s.id);

    document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
    const activeCard = document.querySelector(`.card[data-id="${s.id}"]`);
    if (activeCard) {
      activeCard.classList.add('active-card');
      activeCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    const ex       = exampleMap[s.id];
    const hasCode  = ex && ex.hasCode;
    const code     = ex ? ex.arduino : null;
    const notes    = ex ? ex.notes   : null;
    const isFav    = favourites.has(s.id);
    const hasNotes = notes || (s.warnings || []).length || (s.tips || []).length;

    const tagBadges = (s.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

    const pinsRows = (s.pins || []).map(p => `
      <tr>
        <td><span class="pin-name-cell">${escapeHtml(p.name)}</span></td>
        <td><span class="pin-type-badge ${getPinTypeClass(p.connection)}">${escapeHtml(p.connection)}</span></td>
        <td class="pin-desc-cell">${escapeHtml(p.description)}</td>
      </tr>`).join('');

    const codeContent = (hasCode && code && code !== 'N/A')
      ? `<div class="code-container">
           <div class="code-header">
             <span class="code-lang"><span class="code-dot"></span>Arduino C++</span>
             <button class="copy-btn" onclick="copyCode(this)">⎘ COPY</button>
           </div>
           <pre><code>${wrapLines(highlightCode(escapeHtml(code)))}</code></pre>
         </div>`
      : `<div class="no-code-block">
           <span class="no-code-icon">⚙</span>
           No code required for this module.<br>
           Configure via physical switches, jumpers, or potentiometers.
         </div>`;

    const notesContent = hasNotes
      ? `${notes ? `<div class="info-block notes"><span class="info-label notes">// INFO</span>${escapeHtml(notes)}</div>` : ''}
         ${(s.tips || []).length ? `<div class="info-block tips"><span class="info-label tips">▸ PRO TIPS</span><ul class="tips-list">${(s.tips || []).map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>` : ''}
         ${(s.warnings || []).length ? `<div class="info-block warn"><span class="info-label warn">⚠ CAUTION</span><ul class="warn-list">${(s.warnings || []).map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul></div>` : ''}`
      : `<div class="no-code-block"><span class="no-code-icon">📋</span>No additional notes for this module.</div>`;

    const panel = document.getElementById('module-panel');
    const imageHtml = s.imageUrl ? `<div class="image-gallery"><img class="image-gallery-img" src="${escapeHtml(s.imageUrl)}" alt="${escapeHtml(s.name)}" onerror="this.style.display='none'; this.parentElement.style.display='none';" /></div>` : '';

    panel.innerHTML = `
      <div class="panel-header">
        <div class="panel-title-area">
          <span class="panel-id">#${String(s.id).padStart(2, '0')}</span>
          <div class="panel-title">${escapeHtml(s.name)}</div>
          <span class="cat-badge ${getCatClass(s.category)}">${s.category}</span>
        </div>
        <div class="panel-actions">
          <button class="icon-btn${isFav ? ' active-amber' : ''}" id="panel-fav-btn">
            ★ <span id="panel-fav-label">${isFav ? 'SAVED ✓' : 'FAVOURITE'}</span>
          </button>
          <button class="icon-btn" id="close-panel" style="color:var(--muted)" title="Close (Esc)">✕ CLOSE</button>
        </div>
      </div>

      <div class="panel-tabs" id="panel-tabs">
        <button class="tab-btn active" data-tab="overview">OVERVIEW</button>
        <button class="tab-btn" data-tab="pinout">PINOUT <span style="opacity:.45;font-size:.6rem;margin-left:.1rem">(${(s.pins || []).length})</span></button>
        <button class="tab-btn" data-tab="code">${hasCode ? 'CODE ✓' : 'CODE'}</button>
        <button class="tab-btn" data-tab="notes">NOTES${hasNotes ? ' ●' : ''}</button>
      </div>

      <div id="tab-overview" class="tab-pane active">
        ${imageHtml}
        <div class="meta-grid">
          <div class="meta-item"><span class="meta-key">MODULE ID</span><span class="meta-val">#${String(s.id).padStart(2, '0')}</span></div>
          <div class="meta-item"><span class="meta-key">VOLTAGE</span><span class="meta-val">${escapeHtml(s.voltage || '—')}</span></div>
          <div class="meta-item"><span class="meta-key">PINS</span><span class="meta-val">${(s.pins || []).length}</span></div>
          <div class="meta-item"><span class="meta-key">CODE</span><span class="meta-val" style="color:${hasCode ? 'var(--green)' : 'var(--muted)'}">${hasCode ? 'YES' : 'N/A'}</span></div>
          <div class="meta-item" style="grid-column:1/-1"><span class="meta-key">TAGS</span><div class="meta-tags">${tagBadges || '<span style="color:var(--muted);font-size:.75rem;font-family:var(--mono)">—</span>'}</div></div>
        </div>
        <div class="panel-section-title">DESCRIPTION</div>
        <p class="panel-desc">${escapeHtml(s.description || '')}</p>
      </div>

      <div id="tab-pinout" class="tab-pane">
        <div class="pin-table-wrapper">
          <table class="pin-table">
            <thead><tr><th>PIN</th><th>TYPE</th><th>DESCRIPTION</th></tr></thead>
            <tbody>${pinsRows}</tbody>
          </table>
        </div>
      </div>

      <div id="tab-code" class="tab-pane">${codeContent}</div>

      <div id="tab-notes" class="tab-pane">${notesContent}</div>
    `;

    panel.querySelector('#panel-tabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn || !btn.dataset.tab) return;
      panel.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      panel.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      const pane = panel.querySelector(`#tab-${btn.dataset.tab}`);
      if (pane) pane.classList.add('active');
    });

    panel.querySelector('#panel-fav-btn').addEventListener('click', () => {
      if (activeModuleId === null) return;
      const cardStar = document.querySelector(`.fav-btn[data-id="${activeModuleId}"]`);
      toggleFav(activeModuleId, cardStar);
      syncPanelFavBtn();
    });

    panel.querySelector('#close-panel').addEventListener('click', clearModule);

    if (window.innerWidth <= 960) {
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function renderEmptyState() {
    const data = typeof sensorsData !== 'undefined' ? sensorsData : [];
    const recentModules = recentlyViewed.map(id => data.find(s => s.id === id)).filter(Boolean);

    const recentHtml = recentModules.length ? `
      <div class="empty-recent">
        <div class="empty-recent-title">// Recently Viewed</div>
        <div class="empty-recent-chips">
          ${recentModules.map(s => `
            <button class="empty-chip" data-id="${s.id}">
              <span class="cat-badge ${getCatClass(s.category)}" style="font-size:.52rem;padding:.08rem .3rem">${s.category}</span>
              ${escapeHtml(s.name)}
            </button>
          `).join('')}
        </div>
      </div>
    ` : '';

    const panel = document.getElementById('module-panel');
    panel.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚡</div>
        <div class="empty-title">AWAITING INPUT</div>
        <p class="empty-sub">Select a module from the vault to view its pinout, example code, and reference notes.</p>
        ${recentHtml}
        <div class="shortcuts-hint">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>Enter</kbd> open</span>
          <span><kbd>Esc</kbd> close</span>
          <span><kbd>${kbdHint}</kbd> search</span>
        </div>
      </div>
    `;

    panel.querySelectorAll('.empty-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const s = data.find(d => d.id === parseInt(chip.dataset.id));
        if (s) loadModule(s);
      });
    });
  }

  function clearModule() {
    activeModuleId = null;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
    renderEmptyState();
    if (window.innerWidth <= 960) {
      document.querySelector('.sidebar').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function copyCode(btn) {
    const pre  = btn.closest('.code-container').querySelector('pre code');
    const text = pre ? pre.innerText : '';
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ COPIED';
      btn.classList.add('copied');
      showToast('Code copied to clipboard');
      setTimeout(() => { btn.textContent = '⎘ COPY'; btn.classList.remove('copied'); }, 2000);
    }).catch(() => showToast('Copy failed', 'error'));
  }

  /* ═══════════════════════════════════════════
     KEYBOARD NAVIGATION
  ═══════════════════════════════════════════ */
  const searchEl = document.getElementById('search');

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
      return;
    }

    if (document.activeElement === searchEl) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        searchEl.blur();
        focusedIdx = 0;
        updateKeyboardFocus();
      }
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      focusedIdx = Math.min(focusedIdx + 1, filteredData.length - 1);
      updateKeyboardFocus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (focusedIdx <= 0) { searchEl.focus(); focusedIdx = -1; return; }
      focusedIdx--;
      updateKeyboardFocus();
    } else if (e.key === 'Enter' && focusedIdx >= 0 && filteredData[focusedIdx]) {
      loadModule(filteredData[focusedIdx]);
    } else if (e.key === 'Escape') {
      if (activeModuleId !== null) {
        clearModule();
      } else if (currentSearch) {
        currentSearch = '';
        searchEl.value = '';
        if (typeof sensorsData !== 'undefined') renderCards(sensorsData);
      }
    }
  });

  function updateKeyboardFocus() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('keyboard-focus'));
    const focused = filteredData[focusedIdx];
    if (!focused) return;
    const card = document.querySelector(`.card[data-id="${focused.id}"]`);
    if (card) {
      card.classList.add('keyboard-focus');
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  /* ═══════════════════════════════════════════
     COMPACT TOGGLE
  ═══════════════════════════════════════════ */
  const compactBtn = document.getElementById('compact-toggle');

  function applyCompactState() {
    document.body.classList.toggle('compact', compactMode);
    compactBtn.classList.toggle('active-blue', compactMode);
    const lbl = compactBtn.querySelector('.btn-label');
    if (lbl) lbl.textContent = 'COMPACT';
  }

  compactBtn.addEventListener('click', () => {
    compactMode = !compactMode;
    localStorage.setItem(COMPACT_KEY, compactMode ? '1' : '0');
    applyCompactState();
  });

  applyCompactState();

  /* ═══════════════════════════════════════════
     SEARCH
  ═══════════════════════════════════════════ */
  searchEl.addEventListener('input', () => {
    currentSearch = searchEl.value;
    if (typeof sensorsData !== 'undefined') renderCards(sensorsData);
  });

  /* ═══════════════════════════════════════════
     FILTER BAR
  ═══════════════════════════════════════════ */
  document.getElementById('filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    if (typeof sensorsData !== 'undefined') renderCards(sensorsData);
  });

  /* ═══════════════════════════════════════════
     FAVOURITES FILTER
  ═══════════════════════════════════════════ */
  document.getElementById('fav-filter-btn').addEventListener('click', function () {
    showFavsOnly = !showFavsOnly;
    this.classList.toggle('active-amber', showFavsOnly);
    if (typeof sensorsData !== 'undefined') renderCards(sensorsData);
  });

  /* ═══════════════════════════════════════════
     LOGO RESET
  ═══════════════════════════════════════════ */
  document.getElementById('logo-home').addEventListener('click', e => {
    e.preventDefault();
    clearModule();
    currentSearch = '';
    searchEl.value = '';
    currentFilter = 'all';
    showFavsOnly = false;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-cat="all"]').classList.add('active');
    document.getElementById('fav-filter-btn').classList.remove('active-amber');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (typeof sensorsData !== 'undefined') renderCards(sensorsData);
  });

  /* ═══════════════════════════════════════════
     INIT
  ═══════════════════════════════════════════ */
  updateFavBadge();
  renderEmptyState();
  if (typeof sensorsData !== 'undefined') {
    renderCards(sensorsData);
    updateCategoryCounts(sensorsData);
  }
  </script>
</body>
</html>
